<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>توقع عمر أبالوني (Abalone Age Prediction)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f7f6;
        }

        .container {
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
            border-radius: 4px;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 4px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .error {
            color: red;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>توقع عمر أبالوني</h2>
        <form action="/predict" method="POST">
            <div class="form-group">
                <label>الجنس (Sex):</label>
                <select name="sex" required>
                    <option value="0">ذكر (M)</option>
                    <option value="1">أنثى (F)</option>
                    <option value="2">يافع/غير مكتمل (I)</option>
                </select>
            </div>
            <div class="form-group"><label>الطول (Length):</label><input type="number" step="any" name="length"
                    required></div>
            <div class="form-group"><label>القطر (Diameter):</label><input type="number" step="any" name="diameter"
                    required></div>
            <div class="form-group"><label>الارتفاع (Height):</label><input type="number" step="any" name="height"
                    required></div>
            <div class="form-group"><label>الوزن الكلي (Whole Weight):</label><input type="number" step="any"
                    name="wholeWeight" required></div>
            <div class="form-group"><label>وزن اللحم (Shucked Weight):</label><input type="number" step="any"
                    name="Shuckedweight" required></div>
            <div class="form-group"><label>وزن الأحشاء (Viscera Weight):</label><input type="number" step="any"
                    name="Visceraweight" required></div>
            <div class="form-group"><label>وزن القوقعة (Shell Weight):</label><input type="number" step="any"
                    name="Shellweight" required></div>

            <button type="submit">توقع العمر</button>
        </form>

        {% if age is not none and age != '' %}
        <div class="result">العمر المتوقع (عدد الحلقات / Rings): {{ age }}</div>
        {% endif %}

        {% if error_message %}
        <div class="error">{{ error_message }}</div>
        {% endif %}
    </div>
</body>

</html>
